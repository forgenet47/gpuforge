role = "miner"
network = "local"
netuid = 1

[timeouts]
request_seconds = 30
job_seconds = 3600
shutdown_seconds = 30

[storage]
root = ".gpuforge/miner"
max_artifact_bytes = 21474836480
max_checkpoint_bytes = 8589934592

[evidence]
minimum_tier = "c"
fail_closed = true
max_age_seconds = 300

[sandbox]
cpu_cores = 8
memory_mb = 32768
gpu_count = 1
pids_limit = 512
writable_bytes = 21474836480
network_policy = "deny"
