[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "gpuforge-subnet"
version = "0.0.0.dev1"
description = "Development scaffold for a verifiable GPU training subnet"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [{ name = "GPUForge contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
]

[project.scripts]
gpuforge = "gpuforge.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gpuforge = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
minversion = "8.3"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
omit = ["src/gpuforge/__main__.py"]
source = ["gpuforge"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.10"
strict = true
warn_unreachable = true
